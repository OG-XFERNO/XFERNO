# BDAG-specific Foundry Configuration
# Uses Paris EVM for BDAG compatibility

[profile.default]
src = "src-bdag"
out = "out-bdag"
libs = ["lib-bdag", "lib"]
script = "script"

solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"

remappings = [
    "@openzeppelin/contracts/=lib-bdag/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

fs_permissions = [{ access = "read-write", path = "./deployments" }]
